name: CourseCore CD

# Continuous delivery to Google Cloud Run (image in Artifact Registry) and Neon.
#
#   CI green on master ──► image ──► migrations ──► deploy (new revision, no traffic)
#                                       │              └─► smoke test ──► shift traffic
#                           both wait for approval in the `production` environment
#
# A revision that fails its smoke test never receives traffic, so the previous one
# keeps serving. Setup: deploy/cloudrun/setup.sh and Docs/deployment-cloudrun.md.
on:
  workflow_run:
    workflows: ["CourseCore CI"]
    types: [completed]
    branches: [master, main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no service account key)

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SERVICE: coursecore-api

jobs:
  # A failed CI run must never reach production.
  image:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Resolve what is being released
        id: ref
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$REGION" ]; then
            echo "::error::Set the repository variables GCP_PROJECT_ID and GCP_REGION (see deploy/cloudrun/setup.sh)"
            exit 1
          fi
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=${REGION}-docker.pkg.dev/${PROJECT}/coursecore/api:sha-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (final stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: |
            ${{ steps.ref.outputs.ref }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/coursecore/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Always produces the reviewed, idempotent SQL. It is only applied to Neon
  # when the repository variable APPLY_MIGRATIONS is "true", and only after the
  # `production` environment approval (take a Neon branch/snapshot before approving).
  migrations:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p artifacts/migrations
          dotnet ef migrations script --idempotent \
            --context CourseCoreDbContext \
            --output artifacts/migrations/coursecore-migration.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: artifacts/migrations/coursecore-migration.sql

      - name: Apply migrations to Neon
        if: vars.APPLY_MIGRATIONS == 'true'
        env:
          # Direct (non-pooled) Neon connection string.
          NEON_DIRECT_CONNECTION: ${{ secrets.NEON_DIRECT_CONNECTION }}
        run: |
          if [ -z "$NEON_DIRECT_CONNECTION" ]; then
            echo "::error::Secret NEON_DIRECT_CONNECTION is not set in the production environment"
            exit 1
          fi
          psql "$NEON_DIRECT_CONNECTION" -v ON_ERROR_STOP=1 -f artifacts/migrations/coursecore-migration.sql

  deploy:
    needs: [image, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout (deploy config only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.sha }}
          sparse-checkout: deploy/cloudrun

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a new revision (no traffic yet)
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          secrets="$(grep -v '^#' deploy/cloudrun/secrets.txt | grep . | sed 's/=\(.*\)/=\1:latest/' | paste -sd, -)"

          args=(
            "$SERVICE"
            --image "$IMAGE_REF"
            --region "$REGION"
            --service-account "coursecore-run@${PROJECT}.iam.gserviceaccount.com"
            --env-vars-file deploy/cloudrun/env.yaml
            --set-secrets "$secrets"
            --allow-unauthenticated
            --port 8080
            --cpu 1 --memory 512Mi --cpu-boost
            --min-instances 0 --max-instances 2
            --concurrency 80 --timeout 60
          )

          # The very first deploy has nothing to protect and cannot be tagged without traffic.
          if gcloud run services describe "$SERVICE" --region "$REGION" > /dev/null 2>&1; then
            args+=(--no-traffic --tag candidate)
          fi

          gcloud run deploy "${args[@]}"

      - name: Smoke test the new revision, then shift traffic to it
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: |
          json="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          url="$(echo "$json" | jq -r '.status.traffic[] | select(.tag == "candidate") | .url' | head -n1)"

          if [ -z "$url" ]; then
            # First deploy: the only revision already serves 100% of the traffic.
            url="$(echo "$json" | jq -r '.status.url')"
            echo "first deploy, testing the service URL"
          fi

          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "${url}/health/ready" > /dev/null; then
              echo "${url}/health/ready is up"
              gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest
              gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags candidate || true
              echo "API: $(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
              exit 0
            fi
            echo "attempt $attempt failed (cold start or not ready), retrying..."
            sleep 10
          done

          echo "::error::The new revision did not become ready. Traffic was NOT shifted; the previous revision keeps serving."
          exit 1
