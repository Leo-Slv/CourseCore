# Non-secret configuration of the Cloud Run service. Applied on every deploy by
# .github/workflows/cd.yml (`gcloud run deploy --env-vars-file`). Secrets live in
# Secret Manager (see deploy/cloudrun/secrets.txt) and are never written here.
ASPNETCORE_ENVIRONMENT: "Production"
# Cloud Run terminates TLS and sets X-Forwarded-*; the Vercel rewrite adds one more hop,
# so trust two hops to rate-limit by the real client IP (see Docs/deployment-cloudrun.md).
ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
ForwardedHeaders__ForwardLimit: "2"

Jwt__Issuer: "CourseCore"
Jwt__Audience: "CourseCore"
Auth__RefreshTokenCookie__Secure: "true"
Auth__RefreshTokenCookie__SameSite: "Lax"

# Frontend on Vercel. The browser reaches the API through the Vercel rewrite (same origin).
Frontend__BaseUrl: "https://plataforma-vdg.vercel.app"
Cors__AllowedOrigins__0: "https://plataforma-vdg.vercel.app"

# Lessons are YouTube embeds; add S3 here only when uploads are enabled.
Media__Playback__BaseUrl: "/media"
Media__Playback__AllowedStorageProviders__0: "YouTube"

Resend__FromAddress: "REPLACE_WITH_VERIFIED_RESEND_FROM_ADDRESS"
Resend__FromName: "Viver da Graça"

Seed__Admin__Enabled: "false"
